<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>日程同步</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>try{var t=localStorage.getItem('sched.theme.v1');if(t!=='dark'&&t!=='light'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="tb-left">
      <div class="nav-group">
        <button class="icon-btn" id="btnPrev" aria-label="上一页">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="pill ghost" id="btnToday">今天</button>
        <button class="icon-btn" id="btnNext" aria-label="下一页">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <h1 id="title">2026年11月</h1>
    </div>
    <div class="tb-right">
      <div class="status" id="status" title="同步状态"><span class="dot"></span><span class="status-text">连接中…</span></div>
      <button class="icon-btn" id="btnTheme" aria-label="切换白天/夜间" title="切换白天/夜间">
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.6v2.4M12 19v2.4M21.4 12h-2.4M5 12H2.6M18.3 5.7l-1.7 1.7M7.4 16.6l-1.7 1.7M18.3 18.3l-1.7-1.7M7.4 7.4L5.7 5.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20"><path d="M20.6 14.3A8.6 8.6 0 0 1 9.7 3.4 8.6 8.6 0 1 0 20.6 14.3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="btnMenu" aria-label="设置" title="设置">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h10M18 17h2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="16" cy="7" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="12" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="17" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="month" class="active">月</button>
    <button data-view="week">周</button>
    <button data-view="day">日</button>
    <button data-view="todo">待办</button>
  </nav>

  <main id="main" class="main"></main>

  <button class="fab" id="btnAdd" aria-label="新建">
    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <div class="offline-banner" id="offlineBanner" hidden>
    连接不上电脑端服务：改动先存在本机，恢复后会自动同步。<a href="#" id="offlineHelp">怎么连上？</a>
  </div>
</div>

<!-- 编辑弹层 -->
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-backdrop" data-close="1"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <span class="sheet-kind" id="sheetKind">日程</span>
      <h2 id="sheetTitle">新建日程</h2>
      <button class="icon-btn" data-close="1" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <label class="field">
        <span>标题</span>
        <input id="fTitle" type="text" placeholder="要做的事" maxlength="60" autocomplete="off">
      </label>
      <div class="field-row" id="dateRow">
        <label class="field">
          <span>日期</span>
          <input id="fDate" type="date">
        </label>
        <label class="field switch-field">
          <span>全天</span>
          <input id="fAllDay" type="checkbox">
        </label>
      </div>
      <div class="field-row" id="timeRow">
        <label class="field">
          <span>开始</span>
          <input id="fStart" type="time" step="300">
        </label>
        <label class="field">
          <span>结束</span>
          <input id="fEnd" type="time" step="300">
        </label>
      </div>
      <div class="field" id="colorField">
        <span>分类</span>
        <div class="color-row" id="colorRow"></div>
      </div>
      <div class="field" id="remindField">
        <span>提醒</span>
        <select id="fRemind">
          <option value="">不提醒</option>
          <option value="0">准时</option>
          <option value="5">提前 5 分钟</option>
          <option value="10">提前 10 分钟</option>
          <option value="15">提前 15 分钟</option>
          <option value="30">提前 30 分钟</option>
          <option value="60">提前 1 小时</option>
          <option value="1440">提前 1 天</option>
        </select>
      </div>
      <div class="field" id="todoExtra" hidden>
        <div class="field-row">
          <label class="field">
            <span>截止日期</span>
            <input id="fDue" type="date">
          </label>
          <label class="field">
            <span>优先级</span>
            <select id="fPriority">
              <option value="3">高</option>
              <option value="2" selected>中</option>
              <option value="1">低</option>
            </select>
          </label>
        </div>
        <label class="field check-field">
          <input id="fDone" type="checkbox">
          <span>已完成</span>
        </label>
      </div>
      <label class="field">
        <span>备注</span>
        <textarea id="fNote" rows="2" placeholder="可选" maxlength="300"></textarea>
      </label>
    </div>
    <div class="sheet-foot">
      <button class="btn danger-ghost" id="btnDelete" hidden>删除</button>
      <div class="grow"></div>
      <button class="btn ghost" data-close="1">取消</button>
      <button class="btn primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<!-- 设置面板 -->
<div class="sheet-wrap" id="settingsWrap" hidden>
  <div class="sheet-backdrop" data-close="1"></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <span class="sheet-kind">设置</span>
      <h2>同步与提醒</h2>
      <button class="icon-btn" data-close="1" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <section class="setting-block" id="connectBlock">
        <h3>手机连接地址</h3>
        <p class="hint" id="connectHint">手机和电脑连同一个 Wi-Fi，用手机浏览器打开下面的地址即可同步。</p>
        <div class="qr-box" id="qrBox" hidden><div id="qrcode"></div></div>
        <div class="url-list" id="urlList"></div>
        <button class="btn ghost small" id="btnCopyUrl" hidden>复制地址</button>
      </section>
      <section class="setting-block">
        <h3>到点提醒</h3>
        <p class="hint" id="notifyHint">电脑浏览器可以弹系统通知；手机上建议同时导出到日历 App 才能锁屏提醒。</p>
        <button class="btn ghost small" id="btnNotify">开启浏览器通知</button>
      </section>
      <section class="setting-block">
        <h3>数据</h3>
        <div class="btn-row">
          <button class="btn ghost small" id="btnExportIcs">导出 .ics 日历</button>
          <button class="btn ghost small" id="btnExportJson">导出 JSON 备份</button>
          <button class="btn ghost small" id="btnImportJson">导入 JSON</button>
        </div>
        <p class="hint">导出 .ics 后可导入小米日历，获得系统级的锁屏提醒。</p>
        <input type="file" id="fileJson" accept="application/json,.json" hidden>
      </section>
      <section class="setting-block">
        <h3>关于</h3>
        <p class="hint">日程同步 · 局域网双端同步<br>数据保存在运行服务的那台电脑上。</p>
      </section>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="vendor/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
